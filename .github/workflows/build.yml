name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-large
            name: macos-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: windows-latest
            name: windows-x64
            arch: x64
          - os: windows-11-arm
            name: windows-arm64
            arch: ARM64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup test suite (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          cd refs/yaml-test-suite
          git fetch origin data:data
          make data

      - name: Setup test suite (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          cd refs/yaml-test-suite
          git fetch origin data:data
          make data
        shell: bash

      - name: Restore test results cache
        if: matrix.name == 'linux-x64'
        uses: actions/cache/restore@v4
        with:
          path: build/.cyaml_suite_results
          key: test-results-${{ github.sha }}
          restore-keys: |
            test-results-

      - name: Build (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          cmake -S . -B build -A ${{ matrix.arch }}
          cmake --build build --config Release

      - name: Test (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          cd build
          ./cyaml_suite ../refs/yaml-test-suite/data
          ./ypath_test ../refs/ypath/tests.yml
          ./test_api

      - name: Test (Windows)
        if: startsWith(matrix.os, 'windows')
        working-directory: build
        run: |
          .\Release\cyaml_suite.exe ..\refs\yaml-test-suite\data
          .\Release\ypath_test.exe ..\refs\ypath\tests.yml
          .\Release\test_api.exe

      - name: Generate summary (Unix)
        if: "!startsWith(matrix.os, 'windows') && always()"
        run: cd build && ./summary_gen >> $GITHUB_STEP_SUMMARY

      - name: Generate summary (Windows)
        if: startsWith(matrix.os, 'windows') && always()
        working-directory: build
        run: .\Release\summary_gen.exe >> $env:GITHUB_STEP_SUMMARY
        shell: pwsh

      - name: Save test results cache
        if: matrix.name == 'linux-x64' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: build/.cyaml_suite_results
          key: test-results-${{ github.sha }}

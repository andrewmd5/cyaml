name: Documentation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to generate (defaults to git tag)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Fetch existing docs from site branch
        run: |
          if git fetch origin site 2>/dev/null; then
            git worktree add site-branch origin/site
            cp -r site-branch/* docs/ 2>/dev/null || true
            git worktree remove site-branch
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Generate documentation
        run: uv run --with markdown python3 tools/gendocs.py "${{ steps.version.outputs.version }}"

      - name: Push to site branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp -r docs/* "$tmp"
          git fetch origin site:site 2>/dev/null || git switch --orphan site
          git switch site 2>/dev/null || git switch --orphan site
          rm -rf *
          cp -r "$tmp"/* .
          git add -A
          git commit -m "docs: ${{ steps.version.outputs.version }}" || true
          git push origin site

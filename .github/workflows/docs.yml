name: Documentation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to generate (defaults to git tag)'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Restore docs cache
        uses: actions/cache/restore@v4
        with:
          path: docs/*.json
          key: docs-json-${{ github.run_id }}
          restore-keys: |
            docs-json-

      - name: Generate documentation
        run: uv run --with markdown python3 tools/gendocs.py "${{ steps.version.outputs.version }}"

      - name: Save docs cache
        uses: actions/cache/save@v4
        with:
          path: docs/*.json
          key: docs-json-${{ github.run_id }}

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/
          retention-days: 90
